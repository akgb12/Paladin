spring:
  application:
    name: paladin-backend
  graphql:
    graphiql:
      enabled: true
    path: /graphql

server:
  port: 8080

paladin:
  dynamodb:
    table: ${PALADIN_DYNAMODB_TABLE:PaladinReceipts}
  local-storage-dir: ${PALADIN_LOCAL_STORAGE_DIR:./local-data/receipts}
  s3-bucket: ${PALADIN_S3_BUCKET:paladin-receipts-dev}
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
    frontend-url: ${PALADIN_FRONTEND_URL:http://localhost:5173}
