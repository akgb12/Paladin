<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" style="font-family: 'JetBrains Mono', 'Courier New', monospace; background: #fbf8f1;">
  <defs>
    <style>
      @keyframes coin-spin {
        0%   { transform: scaleX(1); }
        25%  { transform: scaleX(0.08); }
        50%  { transform: scaleX(1); }
        75%  { transform: scaleX(0.08); }
        100% { transform: scaleX(1); }
      }
      @keyframes coin-edge {
        0%   { transform: scaleX(0); opacity: 1; }
        24%  { transform: scaleX(0.96); opacity: 1; }
        25%  { transform: scaleX(0.04); opacity: 1; }
        49%  { transform: scaleX(0); opacity: 1; }
        50%  { transform: scaleX(0.04); opacity: 1; }
        74%  { transform: scaleX(0.96); opacity: 1; }
        75%  { transform: scaleX(0.04); opacity: 1; }
        100% { transform: scaleX(0); opacity: 1; }
      }
      @keyframes gem1 {
        0%   { transform: translate(0px, 0px) rotate(45deg); }
        25%  { transform: translate(72px, -28px) rotate(45deg); }
        50%  { transform: translate(0px, -56px) rotate(45deg); }
        75%  { transform: translate(-72px, -28px) rotate(45deg); }
        100% { transform: translate(0px, 0px) rotate(45deg); }
      }
      @keyframes gem2 {
        0%   { transform: translate(72px, -28px) rotate(45deg); }
        25%  { transform: translate(0px, -56px) rotate(45deg); }
        50%  { transform: translate(-72px, -28px) rotate(45deg); }
        75%  { transform: translate(0px, 0px) rotate(45deg); }
        100% { transform: translate(72px, -28px) rotate(45deg); }
      }
      @keyframes gem3 {
        0%   { transform: translate(-72px, -28px) rotate(45deg); }
        25%  { transform: translate(0px, 0px) rotate(45deg); }
        50%  { transform: translate(72px, -28px) rotate(45deg); }
        75%  { transform: translate(0px, -56px) rotate(45deg); }
        100% { transform: translate(-72px, -28px) rotate(45deg); }
      }
      @keyframes float-up {
        0%, 100% { transform: translateY(0px); }
        50%       { transform: translateY(-8px); }
      }
      @keyframes glow-pulse {
        0%, 100% { opacity: 0.5; rx: 58; ry: 12; }
        50%       { opacity: 0.2; rx: 48; ry: 8; }
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes marquee {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }
      }

      .coin-group { animation: float-up 4s ease-in-out infinite; transform-origin: 450px 210px; }
      .coin-face  { animation: coin-spin 3.4s ease-in-out infinite; transform-origin: 450px 210px; }
      .coin-edge  { animation: coin-edge 3.4s ease-in-out infinite; transform-origin: 450px 210px; }
      .gem1 { animation: gem1 6s linear infinite; transform-origin: 450px 210px; }
      .gem2 { animation: gem2 6s linear infinite; transform-origin: 450px 210px; }
      .gem3 { animation: gem3 6s linear infinite; transform-origin: 450px 210px; }
      .shadow-el { animation: glow-pulse 4s ease-in-out infinite; transform-origin: 450px 340px; }
      .hero-text { animation: fade-in 0.8s ease-out forwards; }
    </style>

    <radialGradient id="coinFace" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#fde68a"/>
      <stop offset="40%"  stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="coinBack" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#92400e"/>
      <stop offset="50%"  stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="bgStrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gem-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="900" height="420" rx="20"/>
    </clipPath>
  </defs>

  <!-- Background card -->
  <g clip-path="url(#card-clip)">
    <rect width="900" height="420" fill="#fbf8f1"/>

    <!-- Dot grid pattern -->
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(12,11,8,0.08)"/>
    </pattern>
    <rect width="900" height="420" fill="url(#dots)"/>

    <!-- Left dark hero panel -->
    <rect x="0" y="0" width="480" height="420" fill="url(#bgStrip)" rx="0"/>

    <!-- Tile pattern on dark side -->
    <pattern id="tile" width="32" height="32" patternUnits="userSpaceOnUse">
      <text x="2" y="14" font-size="11" fill="rgba(255,255,255,0.06)" font-family="monospace">$</text>
      <text x="18" y="28" font-size="11" fill="rgba(255,255,255,0.04)" font-family="monospace">¢</text>
    </pattern>
    <rect x="0" y="0" width="480" height="420" fill="url(#tile)"/>

    <!-- Glow blobs on dark panel -->
    <ellipse cx="80" cy="60" rx="130" ry="100" fill="rgba(245,158,11,0.18)" filter="url(#glow)"/>
    <ellipse cx="420" cy="380" rx="100" ry="80" fill="rgba(52,211,153,0.12)" filter="url(#glow)"/>

    <!-- LEFT: text content -->
    <g class="hero-text">
      <!-- Tag line -->
      <rect x="36" y="48" width="160" height="22" rx="11" fill="rgba(52,211,153,0.2)" stroke="#10b981" stroke-width="1.5"/>
      <text x="116" y="63" text-anchor="middle" font-size="10" font-weight="bold" fill="#34d399" letter-spacing="2">Ï VAULT ONLINE</text>

      <!-- Main heading -->
      <text x="36" y="108" font-size="34" font-weight="900" fill="white" letter-spacing="-0.5">EVERY RECEIPT,</text>
      <text x="36" y="146" font-size="34" font-weight="900" fill="url(#coinFace)" letter-spacing="-0.5">FORGED IN GOLD.</text>

      <!-- Sub text -->
      <text x="36" y="180" font-size="13" fill="rgba(251,248,241,0.7)" letter-spacing="0.2">Drop a photo. We pull the merchant,</text>
      <text x="36" y="198" font-size="13" fill="rgba(251,248,241,0.7)" letter-spacing="0.2">date, total, and every line item.</text>

      <!-- Stats row -->
      <g transform="translate(36, 230)">
        <!-- Stat 1 -->
        <rect width="110" height="68" rx="12" fill="rgba(251,248,241,0.07)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
        <text x="55" y="28" text-anchor="middle" font-size="9" font-weight="bold" fill="rgba(251,248,241,0.5)" letter-spacing="2">RECEIPTS</text>
        <text x="55" y="55" text-anchor="middle" font-size="28" font-weight="900" fill="white"></text>

        <!-- Stat 2 -->
        <rect x="120" width="110" height="68" rx="12" fill="rgba(251,248,241,0.07)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
        <text x="175" y="28" text-anchor="middle" font-size="9" font-weight="bold" fill="rgba(251,248,241,0.5)" letter-spacing="2">MERCHANTS</text>
        <text x="175" y="55" text-anchor="middle" font-size="28" font-weight="900" fill="white"></text>

        <!-- Stat 3 -->
        <rect x="240" width="130" height="68" rx="12" fill="rgba(251,248,241,0.07)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
        <text x="305" y="28" text-anchor="middle" font-size="9" font-weight="bold" fill="rgba(251,248,241,0.5)" letter-spacing="2">TOTAL SPEND</text>
        <text x="305" y="55" text-anchor="middle" font-size="24" font-weight="900" fill="white">$0.00</text>
      </g>

      <!-- CTA button shapes -->
      <rect x="36" y="330" width="148" height="44" rx="10" fill="#f59e0b" stroke="#0c0b08" stroke-width="2.5"/>
      <rect x="39" y="333" width="148" height="44" rx="10" fill="none" stroke="#0c0b08" stroke-width="0" opacity="0"/>
      <text x="110" y="358" text-anchor="middle" font-size="13" font-weight="800" fill="#0c0b08">” Upload Receipt</text>

      <rect x="196" y="330" width="130" height="44" rx="10" fill="rgba(251,248,241,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <text x="261" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="rgba(255,255,255,0.85)">Library ’</text>
    </g>

    <!-- RIGHT: coin scene -->
    <g class="coin-group">
      <!-- Ground shadow -->
      <ellipse class="shadow-el" cx="450" cy="335" rx="56" ry="11" fill="rgba(245,158,11,0.35)"/>

      <!-- Gems -->
      <g class="gem1">
        <rect x="441" y="201" width="18" height="18" rx="3" fill="#fbbf24" stroke="#0c0b08" stroke-width="1.5" filter="url(#gem-glow)"/>
      </g>
      <g class="gem2">
        <rect x="441" y="201" width="16" height="16" rx="3" fill="#34d399" stroke="#0c0b08" stroke-width="1.5" filter="url(#gem-glow)"/>
      </g>
      <g class="gem3">
        <rect x="442" y="202" width="16" height="16" rx="3" fill="#f472b6" stroke="#0c0b08" stroke-width="1.5" filter="url(#gem-glow)"/>
      </g>

      <!-- Coin edge (shows when face is slim) -->
      <ellipse class="coin-edge" cx="450" cy="210" rx="90" ry="90" fill="url(#edgeGrad)" stroke="#78350f" stroke-width="2"/>

      <!-- Coin face -->
      <ellipse class="coin-face" cx="450" cy="210" rx="90" ry="90" fill="url(#coinFace)" stroke="#92400e" stroke-width="3" filter="url(#glow)"/>

      <!-- Ring on face -->
      <ellipse class="coin-face" cx="450" cy="210" rx="66" ry="66" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

      <!-- P letter on coin -->
      <text class="coin-face" x="450" y="228" text-anchor="middle" font-size="56" font-weight="900" fill="rgba(146,64,14,0.7)" font-family="serif">P</text>
    </g>

    <!-- RIGHT panel label -->
    <text x="620" y="54" text-anchor="middle" font-size="9" font-weight="bold" fill="rgba(12,11,8,0.35)" letter-spacing="3">Á PALADIN GOLD</text>

    <!-- Divider line between panels -->
    <line x1="480" y1="0" x2="480" y2="420" stroke="#0c0b08" stroke-width="2"/>

    <!-- Outer card border -->
    <rect x="1" y="1" width="898" height="418" rx="20" fill="none" stroke="#0c0b08" stroke-width="2"/>
  </g>

  <!-- Bottom marquee strip -->
  <g clip-path="url(#card-clip)">
    <rect x="0" y="388" width="900" height="32" fill="#0f172a"/>
    <line x1="0" y1="388" x2="900" y2="388" stroke="#0c0b08" stroke-width="2"/>
    <g style="animation: marquee 18s linear infinite;">
      <text y="409" font-size="10" font-weight="bold" fill="#f59e0b" letter-spacing="3" font-family="monospace">
        KEEP YOUR RECEIPTS & GUARD YOUR GOLD & NO MORE SHOEBOXES & A KNIGHT FOR YOUR FINANCES & EVERY DOLLAR ACCOUNTED FOR & STORE EVERY RECEIPT & KEEP YOUR RECEIPTS & GUARD YOUR GOLD & NO MORE SHOEBOXES & A KNIGHT FOR YOUR FINANCES & EVERY DOLLAR ACCOUNTED FOR & STORE EVERY RECEIPT & 
      </text>
    </g>
  </g>
</svg>
