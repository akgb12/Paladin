<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <radialGradient id="cg" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#fde68a"/>
      <stop offset="50%"  stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="heroGlow" cx="80%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a"  stop-opacity="0"/>
    </radialGradient>
    <filter id="blur6" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="mainClip">
      <rect width="900" height="520" rx="14"/>
    </clipPath>
    <clipPath id="heroClip">
      <rect x="18" y="52" width="864" height="270" rx="14"/>
    </clipPath>
    <clipPath id="cardL">
      <rect x="18" y="334" width="420" height="170" rx="12"/>
    </clipPath>
    <clipPath id="cardR">
      <rect x="452" y="334" width="430" height="170" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#mainClip)">

    <!-- App background -->
    <rect width="900" height="520" fill="#fdf8ef"/>

    <!-- Dot grid -->
    <pattern id="dp" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#0c0b08" fill-opacity="0.07"/>
    </pattern>
    <rect width="900" height="520" fill="url(#dp)"/>

    <!-- ===== NAVBAR ===== -->
    <rect width="900" height="44" fill="#fdf8ef" stroke="#0c0b08" stroke-width="1.5"/>

    <!-- Logo mark -->
    <rect x="16" y="10" width="24" height="24" rx="5" fill="#0c0b08"/>
    <text x="28" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#f59e0b">P</text>

    <!-- Brand name -->
    <text x="46" y="23" font-family="Arial Black, Arial, sans-serif" font-size="11" font-weight="900" fill="#0c0b08" letter-spacing="1">PALADIN</text>
    <text x="46" y="35" font-family="'Courier New', monospace" font-size="8" fill="#0c0b08" fill-opacity="0.45" letter-spacing="1.5">RECEIPT VAULT</text>

    <!-- Nav pills -->
    <rect x="308" y="12" width="284" height="22" rx="11" fill="#0c0b08"/>
    <text x="364" y="27" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="white" letter-spacing="1">DASHBOARD</text>
    <text x="450" y="27" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="white" fill-opacity="0.5" letter-spacing="1">UPLOAD</text>
    <text x="532" y="27" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="white" fill-opacity="0.5" letter-spacing="1">LIBRARY</text>

    <!-- New Receipt button -->
    <rect x="754" y="10" width="130" height="24" rx="7" fill="#f59e0b" stroke="#0c0b08" stroke-width="1.5"/>
    <text x="819" y="26" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="10" font-weight="800" fill="#0c0b08">+ New Receipt</text>

    <!-- ===== HERO CARD ===== -->
    <g clip-path="url(#heroClip)">
      <!-- Dark background -->
      <rect x="18" y="52" width="864" height="270" fill="#0f172a"/>
      <!-- Warm glow from coin side -->
      <rect x="18" y="52" width="864" height="270" fill="url(#heroGlow)"/>
    </g>
    <rect x="18" y="52" width="864" height="270" rx="14" fill="none" stroke="#0c0b08" stroke-width="1.5"/>

    <!-- Vault online pill -->
    <rect x="34" y="70" width="126" height="19" rx="9" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <circle cx="48" cy="79.5" r="3" fill="#34d399">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="90" y="84" text-anchor="middle" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#34d399" letter-spacing="1.2">VAULT IS ONLINE</text>

    <!-- Hero heading -->
    <text x="34" y="122" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="white" letter-spacing="-0.3">EVERY RECEIPT,</text>
    <text x="34" y="155" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#f59e0b" letter-spacing="-0.3">FORGED IN GOLD.</text>

    <!-- Subtext -->
    <text x="34" y="182" font-family="Arial, sans-serif" font-size="12" fill="white" fill-opacity="0.55">Drop a photo. We yank out the merchant, the date, the total,</text>
    <text x="34" y="198" font-family="Arial, sans-serif" font-size="12" fill="white" fill-opacity="0.55">and every line item. Then we file it under your name. Forever.</text>

    <!-- Action buttons -->
    <rect x="34"  y="216" width="140" height="36" rx="9" fill="#f59e0b" stroke="#0c0b08" stroke-width="1.5"/>
    <text x="104" y="239" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="11" font-weight="800" fill="#0c0b08">+ Upload Receipt</text>

    <rect x="184" y="216" width="140" height="36" rx="9" fill="none" stroke="white" stroke-opacity="0.22" stroke-width="1.5"/>
    <text x="254" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="white" fill-opacity="0.75">Browse Library &#x2192;</text>

    <!-- Stat boxes -->
    <rect x="34"  y="268" width="120" height="42" rx="8" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="50"  y="281" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold" fill="white" fill-opacity="0.38" letter-spacing="1.2">RECEIPTS</text>
    <text x="50"  y="301" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="white">0</text>

    <rect x="164" y="268" width="120" height="42" rx="8" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="180" y="281" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold" fill="white" fill-opacity="0.38" letter-spacing="1.2">MERCHANTS</text>
    <text x="180" y="301" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="white">0</text>

    <rect x="294" y="268" width="140" height="42" rx="8" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="310" y="281" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold" fill="white" fill-opacity="0.38" letter-spacing="1.2">TOTAL SPEND</text>
    <text x="310" y="301" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="white">$0.00</text>

    <!-- PALADIN GOLD label -->
    <text x="670" y="308" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="white" fill-opacity="0.2" letter-spacing="3">&#x2756; PALADIN GOLD</text>

    <!-- ===== ANIMATED COIN ===== -->
    <g>
      <!-- Float group -->
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

      <!-- Shadow on floor -->
      <ellipse cx="670" cy="300" rx="50" ry="8" fill="#f59e0b" fill-opacity="0.22" filter="url(#blur3)">
        <animate attributeName="rx" values="50;36;50" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
        <animate attributeName="opacity" values="0.22;0.07;0.22" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
      </ellipse>

      <!-- Coin body -->
      <circle cx="670" cy="190" r="80" fill="url(#cg)" stroke="#78350f" stroke-width="2.5"/>
      <circle cx="670" cy="190" r="60" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="1.8"/>
      <text x="670" y="212" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#7c2d12" fill-opacity="0.7">P</text>
      <ellipse cx="642" cy="155" rx="20" ry="13" fill="white" fill-opacity="0.18" transform="rotate(-18 670 190)"/>

      <!-- Orbiting gems -->
      <circle r="9" fill="#f59e0b" stroke="#0c0b08" stroke-width="1.2">
        <animateMotion dur="5s" repeatCount="indefinite" path="M 670,190 m 105,0 a 105,36 0 0,1 -210,0 a 105,36 0 0,1 210,0"/>
      </circle>
      <circle r="8" fill="#34d399" stroke="#0c0b08" stroke-width="1.2">
        <animateMotion dur="5s" begin="-1.67s" repeatCount="indefinite" path="M 670,190 m 105,0 a 105,36 0 0,1 -210,0 a 105,36 0 0,1 210,0"/>
      </circle>
      <circle r="8" fill="#f472b6" stroke="#0c0b08" stroke-width="1.2">
        <animateMotion dur="5s" begin="-3.33s" repeatCount="indefinite" path="M 670,190 m 105,0 a 105,36 0 0,1 -210,0 a 105,36 0 0,1 210,0"/>
      </circle>
    </g>

    <!-- ===== BOTTOM CARDS ===== -->

    <!-- Left card: Spend by Month -->
    <g clip-path="url(#cardL)">
      <rect x="18" y="334" width="420" height="170" fill="white"/>
    </g>
    <rect x="18" y="334" width="420" height="170" rx="12" fill="none" stroke="#0c0b08" stroke-width="1.5"/>

    <text x="34"  y="358" font-family="'Courier New', monospace" font-size="8" fill="#0c0b08" fill-opacity="0.4" letter-spacing="1.5">// MONTHLY VAULT</text>
    <text x="34"  y="376" font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="900" fill="#0c0b08">Spend by Month</text>
    <rect x="344" y="361" width="68" height="18" rx="9" fill="#0c0b08"/>
    <text x="378" y="374" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="white" letter-spacing="1">6 MONTHS</text>

    <!-- Empty state in left card -->
    <rect x="54" y="396" width="350" height="90" rx="8" fill="#fdf8ef" stroke="#0c0b08" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="229" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="20">&#x1F9FE;</text>
    <text x="229" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0c0b08" fill-opacity="0.4">No spending data yet &#x2014; upload a receipt!</text>

    <!-- Right card: Hall of Spend -->
    <g clip-path="url(#cardR)">
      <rect x="452" y="334" width="430" height="170" fill="white"/>
    </g>
    <rect x="452" y="334" width="430" height="170" rx="12" fill="none" stroke="#0c0b08" stroke-width="1.5"/>

    <text x="468" y="358" font-family="'Courier New', monospace" font-size="8" fill="#0c0b08" fill-opacity="0.4" letter-spacing="1.5">// TOP MERCHANTS</text>
    <text x="468" y="376" font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="900" fill="#0c0b08">Hall of Spend</text>
    <text x="468" y="410" font-family="Arial, sans-serif" font-size="12" fill="#0c0b08" fill-opacity="0.4">No merchants yet.</text>

    <!-- Card border -->
    <rect x="1" y="1" width="898" height="518" rx="14" fill="none" stroke="#0c0b08" stroke-width="2"/>

  </g>
</svg>
