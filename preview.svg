<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 400" width="860" height="400">
  <defs>
    <radialGradient id="cg" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#fde68a"/>
      <stop offset="50%"  stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="bg" cx="20%" cy="20%" r="80%">
      <stop offset="0%"  stop-color="#1e2d4a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="clip">
      <rect width="860" height="400" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">

    <!-- Right parchment panel -->
    <rect width="860" height="400" fill="#fdf8ef"/>

    <!-- Dot grid overlay -->
    <rect width="860" height="400" fill="none" stroke="none">
      <pattern id="dp" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
        <circle cx="1" cy="1" r="0.8" fill="#0c0b08" fill-opacity="0.08"/>
      </pattern>
    </rect>

    <!-- Left dark panel -->
    <rect width="460" height="400" fill="url(#bg)"/>

    <!-- Ambient gold glow on dark panel -->
    <ellipse cx="120" cy="80" rx="140" ry="110" fill="url(#glow)" filter="url(#blur8)"/>

    <!-- === LEFT PANEL TEXT === -->

    <!-- Status pill -->
    <rect x="34" y="44" width="148" height="22" rx="11" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="50" cy="55" r="3.5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="100" y="60" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#34d399" letter-spacing="1.4">VAULT ONLINE</text>

    <!-- Main heading line 1 -->
    <text x="34" y="108" font-family="Arial Black, Arial, sans-serif" font-size="30" font-weight="900" fill="white" letter-spacing="-0.5">EVERY RECEIPT,</text>

    <!-- Main heading line 2 - gold -->
    <text x="34" y="144" font-family="Arial Black, Arial, sans-serif" font-size="30" font-weight="900" fill="#f59e0b" letter-spacing="-0.5">FORGED IN GOLD.</text>

    <!-- Subtext -->
    <text x="34" y="174" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.6">Drop a photo. We extract the merchant,</text>
    <text x="34" y="192" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.6">date, total, and every line item.</text>

    <!-- Stat cards -->
    <rect x="34"  y="220" width="108" height="64" rx="10" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.12" stroke-width="1.2"/>
    <text x="88"  y="244" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="white" fill-opacity="0.4" letter-spacing="1.6">RECEIPTS</text>
    <text x="88"  y="272" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" fill="white">&#x2014;</text>

    <rect x="152" y="220" width="108" height="64" rx="10" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.12" stroke-width="1.2"/>
    <text x="206" y="244" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="white" fill-opacity="0.4" letter-spacing="1.6">MERCHANTS</text>
    <text x="206" y="272" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" fill="white">&#x2014;</text>

    <rect x="270" y="220" width="130" height="64" rx="10" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.12" stroke-width="1.2"/>
    <text x="335" y="244" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="white" fill-opacity="0.4" letter-spacing="1.6">TOTAL SPEND</text>
    <text x="335" y="272" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900" fill="white">$0.00</text>

    <!-- Buttons -->
    <rect x="34"  y="316" width="154" height="44" rx="10" fill="#f59e0b" stroke="#0c0b08" stroke-width="2.5"/>
    <text x="111" y="344" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="13" font-weight="800" fill="#0c0b08">Upload Receipt</text>

    <rect x="198" y="316" width="118" height="44" rx="10" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="257" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" fill-opacity="0.8">Library</text>

    <!-- Divider -->
    <line x1="460" y1="0" x2="460" y2="400" stroke="#0c0b08" stroke-width="2"/>

    <!-- === RIGHT PANEL: ANIMATED COIN === -->

    <!-- Coin label -->
    <text x="660" y="54" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#0c0b08" fill-opacity="0.35" letter-spacing="3">PALADIN GOLD</text>

    <!-- Floating group: coin + gems all move together -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

      <!-- Ground shadow -->
      <ellipse cx="660" cy="332" rx="54" ry="9" fill="#f59e0b" fill-opacity="0.28" filter="url(#blur4)">
        <animate attributeName="rx" values="54;40;54" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
        <animate attributeName="opacity" values="0.28;0.1;0.28" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
      </ellipse>

      <!-- Coin face -->
      <circle cx="660" cy="200" r="88" fill="url(#cg)" stroke="#78350f" stroke-width="3"/>

      <!-- Coin inner ring -->
      <circle cx="660" cy="200" r="65" fill="none" stroke="white" stroke-opacity="0.22" stroke-width="2"/>

      <!-- P letter -->
      <text x="660" y="225" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold" fill="#7c2d12" fill-opacity="0.72">P</text>

      <!-- Coin highlight -->
      <ellipse cx="630" cy="164" rx="24" ry="16" fill="white" fill-opacity="0.2" transform="rotate(-20 660 200)"/>

      <!-- Orbiting gem 1: gold -->
      <circle r="10" fill="#fbbf24" stroke="#0c0b08" stroke-width="1.5">
        <animateMotion dur="5s" repeatCount="indefinite" path="M 660,200 m 110,0 a 110,38 0 0,1 -220,0 a 110,38 0 0,1 220,0"/>
      </circle>

      <!-- Orbiting gem 2: mint, offset -->
      <circle r="9" fill="#34d399" stroke="#0c0b08" stroke-width="1.5">
        <animateMotion dur="5s" begin="-1.67s" repeatCount="indefinite" path="M 660,200 m 110,0 a 110,38 0 0,1 -220,0 a 110,38 0 0,1 220,0"/>
      </circle>

      <!-- Orbiting gem 3: pink, offset -->
      <circle r="9" fill="#f472b6" stroke="#0c0b08" stroke-width="1.5">
        <animateMotion dur="5s" begin="-3.33s" repeatCount="indefinite" path="M 660,200 m 110,0 a 110,38 0 0,1 -220,0 a 110,38 0 0,1 220,0"/>
      </circle>
    </g>

    <!-- Outer border -->
    <rect x="1" y="1" width="858" height="398" rx="18" fill="none" stroke="#0c0b08" stroke-width="2"/>

  </g>
</svg>
